<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://ntfy.virtualka.dzooky.eu; base-uri 'none'; form-action 'none'">
<title>Connect Spritmonitor</title>
<style>
body{background:#15191f;color:#edf2f7;font:17px system-ui;margin:40px auto;padding:0 22px;max-width:440px}
a{color:#9dcbff}label{display:block;margin-top:24px}
input,button{box-sizing:border-box;width:100%;padding:15px;margin-top:10px;border-radius:8px;font:inherit}
input{border:1px solid #657180;background:#222934;color:white}button{background:#9d2332;color:white;border:0}
button:disabled{opacity:.5}
</style>
<main>
<h1>Connect Spritmonitor</h1>
<p>Paste your personal access token. Then select your vehicle in iDrive.</p>
<p><a href="https://www.spritmonitor.de/en/my_account/change_password.html" target="_blank" rel="noopener noreferrer">Create a Spritmonitor token</a></p>
<form>
<label for="token">Personal access token</label>
<input id="token" type="password" maxlength="256" autocomplete="off" autocapitalize="none" spellcheck="false" required>
<button disabled>Send to iDrive</button>
</form>
<p id="status" role="status"></p>
</main>
<script src="pair.js" defer></script>
</html>
