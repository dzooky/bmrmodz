name: B47 DPF probe candidate values
on:
  push:
    branches: [feature/dpf-b47-readonly-probe]
  pull_request:
    paths:
      - 'apps/dpf/main.js'
      - 'apps/dpf/b47-probe-values.js'
      - 'apps/dpf/b47-probe-values.test.js'
      - 'apps/dpf/app.json'
      - '.github/workflows/dpf-b47-probe.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Syntax validation
        run: |
          node --check apps/dpf/main.js
          node --check apps/dpf/b47-probe-values.js
          node --check apps/dpf/b47-probe-values.test.js
      - name: Validate B47 candidate values
        run: node apps/dpf/b47-probe-values.test.js
      - name: Check tester version
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const app=JSON.parse(fs.readFileSync('apps/dpf/app.json','utf8'));
          assert.strictEqual(app.version,'0.1.38');
          const main=fs.readFileSync('apps/dpf/main.js','utf8');
          assert.ok(main.includes("b47ProbeValues.candidate(did, response)"));
          assert.ok(main.includes("EST: "));
          assert.ok(main.includes("b47ProbeValues.rawReading(did, response)"));
          console.log('DPF B47 v0.1.38 preview ready');
          NODE
