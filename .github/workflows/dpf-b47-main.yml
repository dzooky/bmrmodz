name: DPF B47/B57 validated profiles
on:
  push:
    branches: [feature/dpf-b47-main-supported]
  pull_request:
    paths:
      - 'apps/dpf/**'
      - '.github/workflows/dpf-b47-main.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Syntax and gauge conversion tests
        run: |
          node --check apps/dpf/main.js
          node --check apps/dpf/data-tool-read.js
          node apps/dpf/data-tool-read.test.js
          node apps/dpf/diagnostics.test.js
          node --check apps/dpf/dde-profiles.js
          node --check apps/dpf/distance-record.js
          node apps/dpf/distance-record.test.js
          node apps/dpf/dde-profiles.test.js
          node apps/dpf/regen-message.test.js
          node --test apps/dpf/translations.test.js
      - name: Version and regen-guard checks
        run: |
          node - <<'NODE'
          const fs=require('fs'), assert=require('assert');
          const app=JSON.parse(fs.readFileSync('apps/dpf/app.json'));
          const source=fs.readFileSync('apps/dpf/main.js','utf8');
          assert.strictEqual(app.version,'0.1.74');
          assert.ok(source.includes("ddeProfiles.forDde(actual)"));
          assert.ok(source.includes("if (!profile || !profile.regeneration) return null;"));
          assert.ok(source.includes("profile && profile.regeneration"));
          assert.ok(source.includes("const statusText = inProgress ? 'IN PROGRESS'"));
          assert.ok(source.includes('distanceToAverageKm < 0'), 'show +km after average interval');
          assert.ok(source.includes("distanceHistory.observe(ddeProfiles.km(readings[name], profile.distanceFactor))"));
          assert.ok(source.includes('massGauge(\'SOOT\'') && source.includes('massGauge(\'ASH\''));
          assert.ok(!source.includes("gauge('AVERAGE'"), 'average must not have a fourth gauge');
          assert.ok(!source.includes('Math.max(0, averageKm - sinceKm)'), 'do not clamp countdown at zero');
          console.log('DPF three-gauge adaptive distance layout, signed countdown and profiles verified.');
          NODE
