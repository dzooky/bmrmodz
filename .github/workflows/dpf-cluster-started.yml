name: DPF cluster Started alert
on:
  push:
    branches: [feature/dpf-cluster-started]
  pull_request:
    paths:
      - 'apps/dpf/regen-message.js'
      - 'apps/dpf/regen-message.test.js'
      - 'apps/dpf/app.json'
      - 'apps/dpf/translations.js'
      - 'apps/dpf/main.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Validate syntax
        run: |
          node --check apps/dpf/regen-message.js
          node --check apps/dpf/main.js
          node --check apps/dpf/translations.js
      - name: Validate notification state machine
        run: node apps/dpf/regen-message.test.js
      - name: Validate version and settings
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const app=JSON.parse(fs.readFileSync('apps/dpf/app.json','utf8'));
          assert.strictEqual(app.version,'0.1.36');
          assert.strictEqual(app.settings.find(s=>s.key==='regenClusterTest').when.cluster6wbAvailable,true);
          assert.strictEqual(app.requires['bmrmodz-car-equipment'],'0.1.0');
          NODE
