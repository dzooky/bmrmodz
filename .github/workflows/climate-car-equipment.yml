name: Climate Comfort shared Car Equipment
on:
  push:
    branches: [feature/climate-comfort-car-equipment]
  pull_request:
    paths:
      - 'apps/climate-comfort/**'
      - 'tools/car-equipment/**'
      - '.github/workflows/climate-car-equipment.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Syntax validation
        run: |
          node --check apps/climate-comfort/main.js
          node --check apps/climate-comfort/equipment.js
          node --check tools/car-equipment/equipment.js
          node --check tools/car-equipment/service.js
      - name: Shared cache and equipment tests
        run: |
          node tools/car-equipment/cache.test.js
          node tools/car-equipment/test.js
          node apps/climate-comfort/equipment.test.js
      - name: App dependency and single reader check
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const app=JSON.parse(fs.readFileSync('apps/climate-comfort/app.json'));
          const tool=JSON.parse(fs.readFileSync('tools/car-equipment/component.json'));
          const main=fs.readFileSync('apps/climate-comfort/main.js','utf8');
          assert.strictEqual(app.version,'0.1.61');
          assert.ok(/^0\\.1\\.(\\d+)$/.test(tool.version) && Number(tool.version.split('.')[2]) >= 1, 'Tool must be at least 0.1.1');
          assert.strictEqual(app.requires['bmrmodz-car-equipment'],'0.1.1');
          assert.ok(main.includes('CarEquipment.check(EQUIPMENT_CODES'));
          assert.ok(main.includes("CarEquipment.request({ op: 'refresh' }"));
          assert.ok(!main.includes('readVehicleOrder('));
          assert.ok(!main.includes('vehicle-order.json'));
          console.log('Climate Comfort uses shared cached FA/VO with explicit manual refresh.');
          NODE
